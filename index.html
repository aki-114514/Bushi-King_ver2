<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ブシキング</title>
<meta name="description" content="戦国武将と技カードで戦う、兜・手裏剣・軍配のジャンケン勝ち抜きバトル">
<meta name="theme-color" content="#161d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブシキング">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one centered column "battle scroll" on an indigo seigaiha night; panels are lacquer trays, gold leaf marks what matters. Single deliberate night theme. */
:root{
  --ai:#161d3a; --ai2:#212a52; --ai3:#2d3870; --line:#3d4a86;
  --gold:#f2c45c; --shu:#f0604a; --sakura:#ffb4c7; --paper:#fbf2e2; --mute:#a7afd2;
  --go:#f0604a; --jin:#4fcb8c; --tetsu:#5aa8f0; --chi:#b98cf2;
  --rN:#9aa3c8; --rR:#63d4d8; --rSR:#f2c45c;
  --wave:rgba(120,140,220,.07);
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background-color:var(--ai);
  background-image:
    radial-gradient(circle at 50% 100%, transparent 0 7px, var(--wave) 7px 9px, transparent 9px 13px, var(--wave) 13px 15px, transparent 15px 19px, var(--wave) 19px 21px, transparent 21px),
    radial-gradient(circle at 50% 100%, transparent 0 7px, var(--wave) 7px 9px, transparent 9px 13px, var(--wave) 13px 15px, transparent 15px 19px, var(--wave) 19px 21px, transparent 21px);
  background-size:44px 22px;
  background-position:0 0, 22px 11px;
  color:var(--paper); font-family:var(--f-body); font-weight:500;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:720px; margin:0 auto; padding-block:16px 40px}
button{font-family:inherit; color:inherit; cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
h1,h2,h3{text-wrap:balance; margin:0}
.disp{font-family:var(--f-disp); font-weight:400; letter-spacing:.02em}

/* buttons */
.btn{border:0; border-radius:14px; padding:14px 22px; font-size:17px; font-weight:900; background:var(--ai3); box-shadow:0 4px 0 #0c1128; transition:transform .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #0c1128}
.btn.gold{background:linear-gradient(180deg,#ffd879,#e2a93a); color:#3a2408; box-shadow:0 4px 0 #8a5b16}
.btn.shu{background:linear-gradient(180deg,#ff7a63,#d9452f); color:#fff; box-shadow:0 4px 0 #7d2316}
.btn.ghost{background:transparent; border:2px solid var(--line); box-shadow:none}
.btn[disabled]{opacity:.4; cursor:default}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.stack{display:flex; flex-direction:column; gap:14px}

/* title */
.title-wrap{text-align:center; padding-top:12px}
.logo{font-family:var(--f-disp); font-size:clamp(46px,13vw,84px); line-height:1; color:var(--gold);
  text-shadow:0 4px 0 #8a5b16, 0 8px 0 #0c1128; letter-spacing:.04em}
.logo small{display:block; font-size:.22em; color:var(--sakura); text-shadow:none; letter-spacing:.4em; margin-top:14px; font-family:var(--f-body); font-weight:900}
.hero-chibis{display:flex; justify-content:center; gap:4px; margin:20px 0 6px}
.hero-chibis .face{width:min(28vw,150px)}
.hero-chibis .face:nth-child(2){transform:translateY(-14px) scale(1.12)}
.title-stats{color:var(--mute); font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums}
.menu{display:flex; flex-direction:column; gap:12px; max-width:320px; margin:22px auto 0}

/* chibi face disc */
.face{aspect-ratio:1; max-width:100%; border-radius:50%; position:relative; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--tc) 55%, #fff) 0 30%, var(--tc) 70%);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), 0 0 0 3px rgba(255,255,255,.12)}
.face svg{width:96%; height:96%; margin-top:8%}
.face.locked{background:var(--ai3)} .face.locked svg{filter:brightness(0) opacity(.45)}

/* panels */
.panel{background:linear-gradient(180deg,var(--ai2),#1b2347); border:1px solid var(--line); border-radius:20px; padding:16px}
.label{font-size:12px; letter-spacing:.14em; color:var(--mute); font-weight:700}

/* badges */
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:900; padding:2px 8px; border-radius:99px; line-height:1.5; white-space:nowrap}
.rar-N{background:linear-gradient(180deg,#e0a578,#a8683c); color:#2a1408}
.rar-R{background:linear-gradient(180deg,#f4f7fb,#a9b6c8); color:#1b2140}
.rar-SR{background:linear-gradient(180deg,#ffe08a,#e2a93a); color:#3a2408}
.rar-UR{background:linear-gradient(90deg,#ff8fb0,#ffd36b,#7ee0b5,#7fb6ff,#c79bff); color:#2a1840}
.type-go{background:var(--go)} .type-jin{background:var(--jin); color:#0b2a1b} .type-tetsu{background:var(--tetsu); color:#0b1d33} .type-chi{background:var(--chi); color:#22113d}
.kind{background:var(--ai3); color:var(--paper)}
.kind-sig{background:var(--sakura); color:#4a1023}

/* grids & tiles */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
.tile{position:relative; border:2px solid var(--line); background:var(--ai2); border-radius:16px; padding:10px 8px 8px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.tile .nm{font-weight:900; font-size:13px; line-height:1.25; min-height:2.5em; display:flex; align-items:center}
.tile .face{width:72px}
.tile.sel{border-color:var(--gold); box-shadow:0 0 0 3px rgba(242,196,92,.3)}
.tile.lock{opacity:.5}
.tile .cnt{position:absolute; top:6px; right:8px; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums}
.tile.UR{border-color:transparent; background:linear-gradient(var(--ai2),var(--ai2)) padding-box, linear-gradient(135deg,#ff8fb0,#ffd36b,#7ee0b5,#7fb6ff,#c79bff) border-box}
.tile.SR{border-color:#9c7a2e}

.wgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px}
.wtile{border:2px solid var(--line); background:var(--ai2); border-radius:14px; padding:10px 12px; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.wtile .top{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.wtile .wn{font-weight:900; font-size:15px}
.wtile .wd{font-size:12px; color:var(--mute); line-height:1.5}
.wtile.dis{opacity:.4; cursor:default}
.wtile.lock{opacity:.45}
.wtile.UR{border-color:transparent; background:linear-gradient(var(--ai2),var(--ai2)) padding-box, linear-gradient(135deg,#ff8fb0,#ffd36b,#7ee0b5,#7fb6ff,#c79bff) border-box}
.wtile.SR{border-color:#9c7a2e}

/* formation */
.form-head{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.form-head .face{width:110px; flex:none}
.form-head .info{flex:1; min-width:0}
.stat-line{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-variant-numeric:tabular-nums; font-size:14px}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.slot{border:2px dashed var(--line); background:var(--ai); border-radius:14px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0}
.slot.on{border-style:solid; border-color:var(--gold); background:#2a2a4a}
.slot .hi{width:40px; height:40px}
.slot .sw{font-size:12px; font-weight:900; text-align:center; line-height:1.3; min-height:2.6em; display:flex; align-items:center}
.slot .sw.none{color:var(--mute); font-weight:500}
.wf{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.tab.mini2{padding:5px 12px; font-size:12px}
.tabs{display:flex; gap:6px; margin:18px 0 10px}
.tab{border:0; background:var(--ai2); padding:8px 16px; border-radius:99px; font-weight:900; font-size:14px}
.tab.on{background:var(--gold); color:#3a2408}
.sticky-foot{position:sticky; bottom:0; padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--ai) 35%); display:flex; gap:10px; justify-content:center; margin-top:10px}

/* battle */
.stage-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.stage-name{font-family:var(--f-disp); font-size:22px; color:var(--gold)}
.pips{display:flex; gap:6px}
.pip{width:12px; height:12px; border-radius:50%; background:var(--ai3)}
.pip.done{background:var(--gold)} .pip.now{background:var(--shu); box-shadow:0 0 0 3px rgba(240,96,74,.3)}
.pip.ex{background:linear-gradient(135deg,#ff8fb0,#ffd36b,#7fb6ff)}
.fighter{display:flex; gap:12px; align-items:center; position:relative}
.fighter .face{width:78px; flex:none}
.fighter .fi{flex:1; min-width:0}
.fname{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.fname b{font-size:17px; font-weight:900}
.hp{height:14px; background:#0d1230; border-radius:99px; overflow:hidden; margin-top:8px; border:1px solid #0a0e24}
.hp i{display:block; height:100%; background:linear-gradient(180deg,#8ff0b2,#39b56a); transition:width .45s ease; border-radius:99px}
.hp i.mid{background:linear-gradient(180deg,#ffe28a,#e9b437)} .hp i.low{background:linear-gradient(180deg,#ff9a87,#e0432c)}
.hpnum{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; margin-top:3px}
.chips{display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; min-height:20px}
.chip{font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--ai3)}
.chip.up{background:#3a5f2c; color:#d9ffc8} .chip.down{background:#6b2a3a; color:#ffd2dc} .chip.seal{background:#46306b; color:#e7d6ff}
.equips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.eq{font-size:11px; display:inline-flex; gap:4px; align-items:center; background:var(--ai); padding:2px 8px 2px 3px; border-radius:99px; border:1px solid var(--line)}
.eq svg{width:18px; height:18px}
.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{position:absolute; left:40px; top:6px; font-family:var(--f-disp); font-size:28px; pointer-events:none; animation:pop .95s forwards; z-index:5; text-shadow:0 3px 0 #0c1128}
.pop.dmg{color:#fff} .pop.heal{color:#8ff0b2} .pop.zero{color:var(--mute); font-size:20px}
@keyframes pop{0%{opacity:0; transform:translateY(10px) scale(.6)}20%{opacity:1; transform:translateY(-6px) scale(1.15)}100%{opacity:0; transform:translateY(-38px)}}

.arena{position:relative; margin:12px 0; padding:28px 14px 14px; border-radius:20px; min-height:150px;
  background:radial-gradient(ellipse at 50% 120%, rgba(240,96,74,.25), transparent 60%), #10162f; border:1px solid var(--line);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.rv{display:flex; flex-direction:column; align-items:center; gap:4px}
.rv .lb{font-size:11px; color:var(--mute); letter-spacing:.1em}
.rcard{width:84px; height:84px; border-radius:18px; background:var(--ai3); display:grid; place-items:center; border:2px solid var(--line)}
.rcard svg{width:62px; height:62px}
.rcard.show{animation:flip .35s}
.rcard.win{border-color:var(--gold); box-shadow:0 0 18px rgba(242,196,92,.55)}
.rcard.lose{opacity:.45}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.verdict{font-family:var(--f-disp); font-size:30px; min-width:4.2em; text-align:center}
.verdict.win{color:var(--gold)} .verdict.lose{color:#8c95c4} .verdict.tie{color:var(--sakura)}
.banner{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); white-space:nowrap; pointer-events:none;
  font-family:var(--f-disp); font-size:clamp(22px,6vw,34px); color:#fff; padding:8px 20px; border-radius:12px;
  background:linear-gradient(90deg,transparent,rgba(240,96,74,.95) 15%,rgba(240,96,74,.95) 85%,transparent); opacity:0}
.banner.go{animation:ban 1.1s forwards}
.banner.sig{background:linear-gradient(90deg,transparent,rgba(185,140,242,.95) 15%,rgba(255,180,199,.95) 85%,transparent)}
@keyframes ban{0%{opacity:0; transform:translate(-30%,-50%)}18%{opacity:1; transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0; transform:translate(-60%,-50%)}}
.hint{text-align:center; font-size:14px; color:var(--sakura); min-height:1.6em; margin:4px 0 10px}
.hint b{color:#fff}
.hands{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.hand{border:0; border-radius:18px; padding:12px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;
  background:linear-gradient(180deg,var(--ai3),var(--ai2)); box-shadow:0 5px 0 #0c1128; transition:transform .08s}
.hand:active{transform:translateY(4px); box-shadow:0 1px 0 #0c1128}
.hand[disabled]{opacity:.45; cursor:default}
.hand .hi{width:54px; height:54px}
.hand .hn{font-family:var(--f-disp); font-size:20px}
.hand .hp2{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums}
.hand .hw{font-size:12px; font-weight:900; color:var(--gold); min-height:1.4em; text-align:center; line-height:1.3}
.hand.fav{box-shadow:0 5px 0 #0c1128, inset 0 0 0 2px rgba(242,196,92,.5)}
.log{margin-top:14px; font-size:13px; line-height:1.7; color:var(--mute); max-height:8.8em; overflow:auto}
.log div:first-child{color:var(--paper)}
.rule{display:flex; gap:6px; align-items:center; justify-content:center; font-size:12px; color:var(--mute); margin-top:10px; flex-wrap:wrap}
.rule .tri-svg.mini{width:110px; height:auto}

/* overlays / screens */
.center{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px}
.big{font-family:var(--f-disp); font-size:clamp(40px,12vw,72px); line-height:1.05}
.intro{position:fixed; inset:0; display:grid; place-items:center; background:rgba(10,14,34,.82); z-index:20; animation:fade 1.5s forwards; pointer-events:none}
.intro .vs{font-family:var(--f-disp); text-align:center; font-size:clamp(26px,8vw,46px); color:var(--gold)}
.intro .vs span{display:block; color:#fff; font-size:.6em; margin-top:8px}
.intro .vs .vs-loc{display:block; font-family:var(--f-body); font-weight:900; font-size:.36em; color:var(--sakura); letter-spacing:.2em; margin-top:6px}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}

/* card reveal */
.reveal{perspective:900px}
.card{width:236px; height:340px; position:relative; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.card.flip{transform:rotateY(180deg)}
.card .back,.card .front{position:absolute; inset:0; border-radius:20px; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.card .back{background:repeating-linear-gradient(45deg,#2d3870 0 10px,#26306a 10px 20px); border:4px solid var(--gold); display:grid; place-items:center}
.card .back span{font-family:var(--f-disp); font-size:44px; color:var(--gold)}
.card .front{transform:rotateY(180deg); padding:0; display:block}
.card .front.SR{border-color:var(--rSR)} .card .front.R{border-color:var(--rR)}
.card .front.UR{border-color:transparent; background:linear-gradient(var(--ai2),var(--ai2)) padding-box, linear-gradient(135deg,#ff8fb0,#ffd36b,#7ee0b5,#7fb6ff,#c79bff) border-box}
.card .front .face{width:120px}
.card .front .cn{font-weight:900; font-size:20px}
.card .front .cd{font-size:12px; color:var(--mute); line-height:1.5}
.card .wicon{width:110px; height:110px; border-radius:24px; display:grid; place-items:center; font-family:var(--f-disp); font-size:52px; background:var(--ai3); color:var(--gold)}
.newtag{color:var(--sakura); font-weight:900; letter-spacing:.2em}

.modal{position:fixed; inset:0; background:rgba(8,11,28,.86); z-index:30; display:grid; place-items:center; padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .panel{max-width:520px; max-height:85vh; overflow:auto; line-height:1.8; font-size:14px}
.modal h3{font-family:var(--f-disp); font-weight:400; color:var(--gold); font-size:22px; margin-bottom:8px}
.modal ul{padding-left:1.2em; margin:6px 0}
.tri{display:flex; align-items:center; justify-content:center; gap:4px; margin:10px 0; flex-wrap:wrap}
.tri .hi{width:46px; height:46px}
.tri .ar{color:var(--gold); font-weight:900}

/* sound button & settings */
#app{padding-top:58px}
#snd{position:fixed; z-index:40; top:calc(env(safe-area-inset-top,0px) + 10px); right:calc(env(safe-area-inset-right,0px) + 12px);
  width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--ai2); display:grid; place-items:center; padding:0}
#snd svg{width:24px; height:24px}
.snd-hint{position:fixed; z-index:39; top:calc(env(safe-area-inset-top,0px) + 20px); right:calc(env(safe-area-inset-right,0px) + 64px); font-size:12px; color:var(--sakura); pointer-events:none}
.vslot{display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--line)}
.vst{font-size:12px; color:var(--mute)}
label.btn{display:inline-block}
.setrow{display:grid; grid-template-columns:5.5em 1fr 3em; gap:10px; align-items:center; margin:12px 0}
.setrow input[type=range]{width:100%; accent-color:var(--gold)}
.setrow output{font-variant-numeric:tabular-nums; text-align:right}
.toggle{display:flex; align-items:center; gap:10px; font-weight:700}
.toggle input{width:22px; height:22px; accent-color:var(--shu)}
.mini{padding:6px 12px; font-size:13px; border-radius:10px}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}

/* count ring */
.verdict.count{width:78px; height:78px; min-width:0; border-radius:50%; display:grid; place-items:center; font-size:34px; color:#fff;
  background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--gold) calc(var(--p)*1turn), #2d3870 0)}
.verdict.count.urgent{color:var(--shu); background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--shu) calc(var(--p)*1turn), #2d3870 0); animation:beat .5s infinite}
.verdict.count.five{background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--sakura) calc(var(--p)*1turn), #2d3870 0)}
@keyframes beat{50%{transform:scale(1.1)}}
.cnt-label{position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--mute); letter-spacing:.1em; white-space:nowrap}

/* matchup table */
.mtab{overflow-x:auto; margin-top:8px}
.mtab table{border-collapse:collapse; width:100%; min-width:460px; font-size:13px}
.mtab th,.mtab td{border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top; line-height:1.5}
.mtab th{color:var(--gold); font-size:12px; letter-spacing:.08em}
.mtab td.res{color:var(--sakura); font-weight:700}
.mh{font-family:var(--f-disp); font-weight:400; color:var(--gold); font-size:16px; margin-top:16px}
.typegrid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:8px}
.typegrid .tg-t{display:block; font-weight:900; color:var(--paper)}
.typegrid small{color:var(--mute)}
.typegrid div{background:var(--ai); border-radius:10px; padding:8px 6px; text-align:center; font-size:12px; line-height:1.5}
.typegrid b{display:block; font-size:18px; font-family:var(--f-disp); font-weight:400}

/* FX */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:25}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-10px,6px)}30%{transform:translate(9px,-7px)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
.flash{position:fixed; inset:0; z-index:26; pointer-events:none; animation:flash .35s forwards}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cutin{position:fixed; inset:0; z-index:27; pointer-events:none; display:grid; place-items:center; overflow:hidden}
.ci-band{width:130%; height:150px; transform:skewY(-6deg); display:flex; align-items:center; justify-content:center; gap:18px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 3px,transparent 3px 40px), linear-gradient(90deg,#4b2a8a,#c9407a 55%,#f2c45c);
  background-size:120px 100%,100% 100%; box-shadow:0 0 0 4px var(--gold), 0 20px 60px rgba(0,0,0,.6);
  animation:ciin 1.5s cubic-bezier(.2,.9,.3,1) forwards, ciline .3s linear infinite}
.ci-band .face{width:120px; flex:none; transform:skewY(6deg)}
.ci-txt{transform:skewY(6deg); text-align:left}
.ci-who{font-size:14px; font-weight:900; letter-spacing:.2em; color:#fff}
.ci-name{font-family:var(--f-disp); font-size:clamp(30px,9vw,54px); color:#fff; text-shadow:0 4px 0 #3a1430, 0 0 18px rgba(255,220,140,.8); line-height:1.1}
.ci-line{font-size:13px; color:#ffe8b0}
@keyframes ciin{0%{transform:skewY(-6deg) translateX(-110%)}18%{transform:skewY(-6deg) translateX(0)}82%{transform:skewY(-6deg) translateX(0); opacity:1}100%{transform:skewY(-6deg) translateX(110%); opacity:0}}
@keyframes ciline{to{background-position:-120px 0,0 0}}
.ofuda{position:fixed; z-index:26; pointer-events:none; width:46px; height:96px; margin:-48px 0 0 -23px; background:#fbf2e2; border:2px solid #c8372a; border-radius:3px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#c8372a; font-family:var(--f-disp); font-size:28px; line-height:1.1;
  animation:ofuda 1.2s forwards; box-shadow:0 6px 18px rgba(0,0,0,.5)}
@keyframes ofuda{0%{transform:scale(3) rotate(-30deg); opacity:0}20%{transform:scale(1) rotate(-8deg); opacity:1}80%{opacity:1}100%{opacity:0; transform:scale(1) rotate(-8deg) translateY(10px)}}

/* scenes: win / appear / lose */
.scene{position:relative; width:100%; max-width:520px; border-radius:24px; overflow:hidden; border:1px solid var(--line); min-height:300px; display:flex; align-items:flex-end; justify-content:center; padding:24px 16px 20px}
.scene.fire{background:radial-gradient(ellipse at 50% 100%, rgba(255,120,40,.55), transparent 65%), linear-gradient(180deg,#2a1530,#5a1d22)}
.scene.dark{background:radial-gradient(ellipse at 70% 40%, rgba(150,40,90,.45), transparent 60%), linear-gradient(180deg,#0b0d1e,#1c1030)}
.scene.dusk{background:linear-gradient(180deg,#2a1d3e 0%,#5a2b3a 55%,#3a2a2a 56%,#241a1c 100%)}
.hero-fire{width:min(52vw,210px); position:relative; z-index:2; animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px) scale(1.03)}}
.shout{position:absolute; top:18px; left:50%; transform:translateX(-50%) rotate(-4deg); font-family:var(--f-disp); font-size:clamp(22px,6.5vw,34px); color:#fff; white-space:nowrap; z-index:3;
  text-shadow:0 3px 0 #a3241a, 0 0 18px rgba(255,140,60,.9); animation:shout .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes shout{from{transform:translateX(-50%) rotate(-4deg) scale(2.2); opacity:0}}
.enemy-in{width:min(56vw,230px); position:relative; z-index:2; filter:brightness(0); animation:silh 2.4s forwards}
@keyframes silh{0%{transform:translateX(120%); filter:brightness(0)}30%{transform:none; filter:brightness(0) drop-shadow(0 0 14px #ff4d6d)}62%{filter:brightness(0) drop-shadow(0 0 22px #ff4d6d)}78%{filter:brightness(2.2)}100%{filter:none; transform:none}}
.appear-title{font-family:var(--f-disp); font-size:clamp(34px,10vw,58px); color:#ff5a4a; text-shadow:0 4px 0 #3a0b14, 0 0 24px rgba(255,80,80,.6); animation:pop2 .7s 1.7s cubic-bezier(.3,1.6,.5,1) both; line-height:1.1}
@keyframes pop2{from{transform:scale(2.2); opacity:0}}
.appear-info{animation:fadeup .5s 2.2s both}
@keyframes fadeup{from{opacity:0; transform:translateY(12px)}}
.bubble{position:relative; background:var(--paper); color:#2a1d2a; border-radius:14px; padding:8px 14px; font-weight:900; font-size:15px; display:inline-block}
.bubble::after{content:""; position:absolute; bottom:-9px; left:50%; margin-left:-8px; border:8px solid transparent; border-top-color:var(--paper); border-bottom:0}
.flee{position:absolute; left:6%; bottom:22px; width:min(30vw,130px); z-index:3; animation:flee .32s ease-in-out infinite alternate}
@keyframes flee{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(-8px,-10px) rotate(4deg)}}
.chaser{position:absolute; right:2%; bottom:10px; width:min(50vw,220px); z-index:2; filter:drop-shadow(0 0 18px rgba(255,60,100,.6)); animation:loom 2s ease-in-out infinite}
@keyframes loom{50%{transform:scale(1.05)}}
.gogo{position:absolute; right:6%; top:14px; font-family:var(--f-disp); font-size:clamp(20px,6vw,30px); color:#c38bff; letter-spacing:.1em; z-index:3; animation:gogo .5s steps(2) infinite}
@keyframes gogo{50%{transform:translate(2px,-2px)}}
.dust{position:absolute; left:calc(6% + min(30vw,130px)); bottom:20px; width:30px; height:14px; border-radius:50%; background:rgba(220,200,180,.5); z-index:1; animation:dust .6s linear infinite}
@keyframes dust{from{transform:translateX(0) scale(.6); opacity:.8}to{transform:translateX(60px) scale(1.6); opacity:0}}
.flee-bubble{position:absolute; left:4%; bottom:calc(22px + min(30vw,130px) + 6px); z-index:4; font-size:13px}
.vow{font-family:var(--f-disp); font-size:clamp(20px,6vw,30px); color:var(--gold); text-shadow:0 3px 0 #5a3a10; animation:pop2 .6s 1s both}

.tri-svg{display:block; width:100%; max-width:380px; margin:6px auto 0; overflow:visible}
.tri-svg.mini{width:96px; margin:0}
.tri-ar{fill:none; stroke:#f2c45c; stroke-width:4; stroke-dasharray:12 8; animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.tri-lb{fill:#f2c45c; font-family:var(--f-disp); font-size:15px; paint-order:stroke; stroke:#212a52; stroke-width:4px}
.tri-why{fill:#a7afd2; font-size:11px; font-family:var(--f-body); font-weight:700; paint-order:stroke; stroke:#212a52; stroke-width:4px}
.tri-why2{fill:#ffb4c7; font-size:12px; font-family:var(--f-body); font-weight:900; paint-order:stroke; stroke:#212a52; stroke-width:4}
.tri-nm{fill:#fbf2e2; font-family:var(--f-disp); font-size:18px}
.tri-sm{fill:#a7afd2; font-size:9.5px; font-family:var(--f-body); font-weight:700}
.ty-k{fill:#fff; font-family:var(--f-disp); font-size:30px}
.tri-c{fill:#a7afd2; font-size:14px; font-weight:900; font-family:var(--f-body); letter-spacing:.1em}
.rels{display:flex; flex-direction:column; gap:8px; margin-top:8px}
.relrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px}
.rchip{border:2px solid var(--line); border-radius:99px; padding:2px 10px; font-weight:900; background:var(--ai)}
.rarr{color:var(--gold)}
.rres{color:var(--sakura); font-weight:700}
.rule{cursor:pointer; border:0; background:transparent; width:100%}
@media (prefers-reduced-motion:reduce){.tri-ar{animation:none}}
/* title shout */
.kakegoe{position:fixed; inset:0; z-index:35; display:grid; place-items:center; background:radial-gradient(circle, rgba(120,20,20,.75), rgba(10,12,30,.95) 70%); pointer-events:none}
.kakegoe .kg{font-family:var(--f-disp); font-size:clamp(40px,12.5vw,110px); color:var(--gold); line-height:1; white-space:nowrap;
  text-shadow:0 6px 0 #8a5b16, 0 12px 0 #0c1128, 0 0 40px rgba(255,160,60,.8); animation:kg 1.9s cubic-bezier(.2,1.5,.4,1) forwards}
.kakegoe .kg span{display:inline-block; animation:kgc .25s both}
@keyframes kg{0%{transform:scale(3) rotate(-8deg); opacity:0}14%{transform:scale(1) rotate(-4deg); opacity:1}22%{transform:scale(1.08) rotate(-4deg)}85%{transform:scale(1.12) rotate(-4deg); opacity:1}100%{transform:scale(1.4) rotate(-4deg); opacity:0}}
@keyframes kgc{from{transform:translateY(-40px); opacity:0}}
.kakegoe.sortie{background:radial-gradient(circle, rgba(200,50,30,.8), rgba(10,12,30,.95) 70%)}
.kakegoe.sortie .kg{color:#fff; text-shadow:0 6px 0 #a3241a, 0 12px 0 #0c1128, 0 0 40px rgba(255,120,60,.9); font-size:clamp(32px,9.5vw,90px); animation-duration:2.3s}
.kakegoe .sub{position:absolute; bottom:22%; font-weight:900; letter-spacing:.5em; color:var(--sakura); animation:fadeup .4s .5s both}

/* ===== battle: one screen, HUD over the battlefield ===== */
body.battle-mode #app{padding-top:6px; padding-bottom:6px; max-width:560px}
body.battle-mode .snd-hint{display:none}
.bt{display:flex; flex-direction:column; gap:6px; height:calc(100vh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); height:calc(100dvh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:480px}
.bt-top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding-right:52px; min-height:44px}
.bt-top .stn{font-family:var(--f-disp); font-size:19px; color:var(--gold); line-height:1.1}
.bt-top .loc{font-size:11px; color:var(--sakura); font-weight:700; letter-spacing:.06em}
.bt-top .pips{margin-top:3px}
.bt-top>div:first-child{min-width:0}
.bt-top .toolbar{gap:5px; flex-wrap:nowrap; flex:none}
.bt-top .row{flex-wrap:nowrap}
.bt-top .stn{white-space:nowrap}
.bt-top .mini{padding:6px 9px; font-size:12px; border-radius:9px; white-space:nowrap}
.bt .arena{flex:1; min-height:0; margin:0; padding:0; display:block; position:relative; overflow:hidden; border-radius:20px; border:1px solid var(--line);
  background:linear-gradient(180deg,transparent 0 60%,var(--gnd) 60% 100%), var(--sky)}
.bt .arena.is3d{min-height:0}
.bt .stage3d{position:absolute; inset:0; display:none; background:var(--sky)}
.bt .arena.is3d .stage3d{display:block; border-radius:0}
.f2d{position:absolute; inset:0}
.bt .arena.is3d .f2d{display:none}
.f2d-e,.f2d-p{position:absolute; width:min(34%,170px)}
.f2d-n{position:absolute; left:40%; top:30%; width:min(20%,86px); opacity:.95}
.f2d-e{right:6%; top:34%} .f2d-p{left:6%; top:36%; width:min(34%,170px)}
.hud{position:absolute; z-index:4; width:auto; padding:7px 9px 6px; border-radius:14px; background:rgba(12,16,40,.78); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.hud-e{top:6px; left:6px; right:72px; border-color:rgba(255,90,90,.55)}
.hud-p{bottom:30px; left:6px; right:6px; border-color:rgba(79,176,255,.6)}
.hud .hn-row{display:flex; gap:4px; align-items:center; flex-wrap:nowrap; min-width:0}
.hud .hn-row b{font-size:14px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.hud .hp{height:11px; margin-top:5px}
.hud .hp-row{display:flex; gap:6px; align-items:center; justify-content:space-between; margin-top:3px}
.hud .hpnum{font-size:11px; margin:0; white-space:nowrap}
.hud .chips{margin:0; min-height:0; justify-content:flex-end}
.hud .chip{font-size:10px; padding:0 5px}
.hud .equips{margin-top:5px; gap:4px; flex-wrap:nowrap; overflow:hidden}
.hud .eq{font-size:10px; padding:1px 6px 1px 2px; white-space:nowrap; min-width:0; flex:1 1 0; overflow:hidden; text-overflow:ellipsis; display:flex}
.hud .eq svg{width:15px; height:15px; flex:none}
.adv{font-size:10px; font-weight:900; padding:1px 6px; border-radius:6px; white-space:nowrap; flex:none}
.adv.up{background:#2f6b3a; color:#d9ffc8} .adv.down{background:#6b2a3a; color:#ffd2dc}
.bt .count{position:absolute; z-index:4; top:8px; right:8px; width:60px; height:60px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--f-disp); font-size:26px; color:#fff;
  background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--gold) calc(var(--p,1)*1turn), #2d3870 0)}
.bt .count.urgent{color:var(--shu); background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--shu) calc(var(--p)*1turn), #2d3870 0); animation:beat .5s infinite}
.bt .count.five{background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(var(--sakura) calc(var(--p)*1turn), #2d3870 0)}
.bt .count.idle{font-size:14px; background:radial-gradient(circle,#10162f 58%,transparent 59%), conic-gradient(#2d3870 0 1turn)}
.bt .cnt-label{position:absolute; z-index:4; top:70px; right:4px; width:68px; left:auto; transform:none; text-align:center; font-size:10px; color:#fff; font-weight:900; text-shadow:0 1px 3px #000}
.omen{position:absolute; z-index:4; left:6px; right:6px; top:var(--omen-top,104px); display:flex; align-items:flex-start; gap:6px; transition:opacity .25s, transform .25s; pointer-events:none}
.omen.gone{opacity:.25}
.hotoke{pointer-events:auto; width:66px; height:70px; flex:none; padding:0; border:0; background:none; animation:hbob 2.4s ease-in-out infinite}
.hotoke svg{width:100%; height:100%; filter:drop-shadow(0 0 8px rgba(255,214,106,.7))}
@keyframes hbob{50%{transform:translateY(-5px)}}
.om-bub{display:flex; flex-direction:column; align-items:flex-start; gap:0; min-width:0}
.omen .om-lb{font-size:11px; font-weight:900; color:#5a3a08; background:#ffd96a; padding:1px 9px; border-radius:6px 6px 0 0; letter-spacing:.06em}
.omen .om-body{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 6px; background:var(--paper); color:#2a1d2a; border-radius:0 14px 14px 14px; box-shadow:0 4px 0 rgba(0,0,0,.25)}
.omen .om-body .hi{width:50px; height:50px; background:#2d3870; border-radius:12px; padding:4px; flex:none}
.omen .om-body b{display:block; font-family:var(--f-disp); font-weight:400; font-size:24px; line-height:1.1}
.omen .om-body small{font-size:12px; font-weight:900; color:#6b2a3a}
.omen.sure .om-body{box-shadow:0 0 0 3px var(--gold), 0 0 18px rgba(255,214,106,.8)}
.om-pray{font-size:10px; font-weight:900; color:#fff; text-shadow:0 1px 3px #000; margin-top:3px}
.tag3d{position:absolute; z-index:3; transform:translate(-50%,-100%); font-size:11px; font-weight:900; color:#fff; padding:1px 9px; border-radius:99px; pointer-events:none; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tag3d.tp{background:#2f86d8; left:24%; top:34%} .tag3d.te{background:#d84040; left:76%; top:32%}
.tag3d::after{content:""; position:absolute; left:50%; bottom:-5px; margin-left:-5px; border:5px solid transparent; border-top-color:inherit; border-bottom:0}
.tag3d.tp::after{border-top-color:#2f86d8} .tag3d.te::after{border-top-color:#d84040}
.bt .rcard{position:absolute; z-index:4; width:58px; height:58px; border-radius:16px; background:rgba(45,56,112,.85); opacity:0; transition:opacity .2s}
.bt .rcard svg{width:42px; height:42px}
.bt .rcard.show{opacity:1}
.bt .rcard.rp{left:8px; top:56%} .bt .rcard.re{right:8px; top:56%}
.bt .rcard::before{position:absolute; top:-15px; left:0; right:0; text-align:center; font-size:10px; font-weight:900; color:#fff; text-shadow:0 1px 3px #000}
.bt .rcard.rp::before{content:"あなた"} .bt .rcard.re::before{content:"敵"}
.bt .verdict{position:absolute; z-index:5; left:0; right:0; top:40%; margin:0 auto; width:max-content; min-width:0; font-size:clamp(30px,9vw,44px); text-shadow:0 3px 0 #0c1128, 0 0 14px rgba(0,0,0,.6); pointer-events:none}
.bt .verdict.show{animation:pop2 .35s cubic-bezier(.3,1.6,.5,1)}
.bt .banner{z-index:6; top:52%}
.ticker{position:absolute; z-index:4; left:0; right:0; bottom:0; height:26px; border:0; background:rgba(8,11,28,.72); color:#e7e9f5; font-size:12px; text-align:left; padding:0 10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:0}
.ticker::after{content:"記録 ▸"; position:absolute; right:0; top:0; bottom:0; padding:0 8px; display:grid; place-items:center; background:rgba(8,11,28,.95); color:var(--gold); font-size:11px; font-weight:900}
.npcb{position:absolute; z-index:5; transform:translate(-50%,-100%); background:#fff4c8; color:#5a3a08; font-weight:900; font-size:13px; padding:4px 10px; border-radius:12px; white-space:nowrap;
  box-shadow:0 0 0 2px #f2c45c; pointer-events:none; opacity:0; transition:opacity .2s}
.npcb.on{opacity:1}
.npcb::after{content:""; position:absolute; left:50%; bottom:-7px; margin-left:-6px; border:6px solid transparent; border-top-color:#fff4c8; border-bottom:0}
.bt-hands{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.bt .hand{padding:7px 4px 7px; gap:1px; border-radius:16px}
.bt .hand .hi{width:38px; height:38px}
.bt .hand .hrow{display:flex; align-items:baseline; gap:5px}
.bt .hand .hn{font-size:18px}
.bt .hand .hp2{font-size:11px}
.bt .hand .hw{font-size:11px; min-height:1.3em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.bt-legend{display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; color:var(--mute); border:0; background:transparent; padding:0; min-height:22px}
.bt-legend svg{width:18px; height:18px}
.bt-legend b{color:var(--gold)}
.pop{position:fixed; z-index:28; transform:translateX(-50%)}
.loglist{max-height:60vh; overflow:auto; font-size:13px; line-height:1.8}
.loglist div:first-child{color:var(--gold)}
@media (max-height:640px){.hud .equips{display:none} .bt .hand .hi{width:30px; height:30px} .omen .om-body .hi{width:38px;height:38px}}
[hidden]{display:none!important}
/* ===== キンピカ座 ===== */
.npc-btn{display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(180deg,#5b2d86,#43206a); box-shadow:0 4px 0 #24103a}
.npc-mini{width:34px; height:34px; display:inline-block; margin:-6px 0}
.npc-mini svg{width:100%; height:100%}
.zamoto{display:flex; flex-direction:column; gap:12px}
.npc-stage{display:flex; gap:12px; align-items:center; background:radial-gradient(ellipse at 30% 40%, rgba(242,196,92,.25), transparent 60%), linear-gradient(180deg,#3a1f5c,#21163f); border-color:#7a5aa8}
.npc-big{width:min(38vw,170px); flex:none}
.npc-big svg{width:100%; height:auto; display:block}
.npc-big.bounce{animation:npcb .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes npcb{0%{transform:translateY(8px) scale(.94)}100%{transform:none}}
.npc-bubble{flex:1; min-width:0; background:var(--paper); color:#2a1d2a; border-radius:16px; padding:10px 12px; position:relative; min-height:96px}
.npc-bubble::before{content:""; position:absolute; left:-9px; top:28px; border:8px solid transparent; border-right-color:var(--paper); border-left:0}
.npc-bubble b{font-size:12px; color:#5b2d86; letter-spacing:.08em}
.npc-bubble p{margin:4px 0 0; font-size:15px; font-weight:700; line-height:1.65}
.npc-menu{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.npc-menu .btn{font-size:15px; padding:12px 10px}
.npc-menu .btn.gold{grid-column:1/-1}
.bless-line{text-align:center; font-size:13px; font-weight:900; color:var(--gold)}
.kuji{text-align:center}
.kuji-box{margin:10px auto; width:110px; height:150px; border-radius:14px; background:linear-gradient(180deg,#c8372a,#8a1f16); color:#fff; display:grid; place-items:center; font-family:var(--f-disp); font-size:20px; writing-mode:vertical-rl; animation:kshake .25s infinite}
@keyframes kshake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.kuji-paper{margin:10px auto; width:140px; padding:16px 10px; background:#fbf6ea; color:#2a1d2a; border:3px solid #c8372a; border-radius:6px; animation:pop2 .5s cubic-bezier(.3,1.6,.5,1)}
.kuji-res{font-family:var(--f-disp); font-size:48px; color:#c8372a; line-height:1.1}
.kuji-eff{font-weight:900; font-size:13px; margin:6px 0}
.kuji .label{color:#6a5a6a}
/* hand tags (色で手を見分ける) */

/* ============ AUDIO (all synthesized: 琴・三味線・尺八・太鼓・鼓・拍子木・鐘) ============ */
const AU={ctx:null,cur:null,want:null,timer:null,step:0,next:0};
let NOISE=null;
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  const c=AU.ctx=new C();
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(c.destination);
  AU.master=c.createGain(); AU.master.connect(comp);
  const len=Math.floor(c.sampleRate*3.8), ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp=lp*.55+(Math.random()*2-1)*.45;d[i]=lp*Math.pow(1-i/len,2.6)*(i<c.sampleRate*.02?.3:1)}
    [.011,.019,.027,.041].forEach((e,k)=>{d[Math.floor(c.sampleRate*(e+ch*.003))]+=.6-k*.1})}
  const mkBus=()=>{const g=c.createGain();g.connect(AU.master);const cv=c.createConvolver();cv.buffer=ir;cv.connect(g);const ri=c.createGain();ri.gain.value=.5;ri.connect(cv);return {out:g,rev:ri}};
  AU.B=mkBus(); AU.X=mkBus();
  NOISE=c.createBuffer(1,c.sampleRate,c.sampleRate);const nd=NOISE.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  applyVol(); prewarm(); voxDecode();
  document.querySelector('.snd-hint')?.remove();
  if(AU.want){const w=AU.want;AU.want=null;playTrack(w)}
}
function applyVol(){
  if(!AU.ctx)return; const t=AU.ctx.currentTime, s=S.settings;
  AU.master.gain.setTargetAtTime(s.mute?0:1,t,.03);
  AU.B.out.gain.setTargetAtTime(Math.pow(s.bgm/100,2)*.55,t,.03);
  AU.X.out.gain.setTargetAtTime(Math.pow(s.sfx/100,2)*.9,t,.03);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MI=[0,1,5,7,8], YO=[0,2,5,7,9];
const deg=(root,sc,d)=>{const o=Math.floor(d/5),i=((d%5)+5)%5;return mtof(root+12*o+sc[i])};
function env(g,t,a,v,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function route(n,bus,rv){n.connect(bus.out);if(rv){const s=AU.ctx.createGain();s.gain.value=rv;n.connect(s);s.connect(bus.rev)}}
function osc(type,f,t,end){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(end);return o}
function noiseSrc(t,end){const s=AU.ctx.createBufferSource();s.buffer=NOISE;s.loop=true;s.start(t,Math.random()*.5);s.stop(end);return s}
function filt(type,f,q=1){const b=AU.ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b}
// instruments — rendered as physical models into buffers (no raw oscillator tones)
const BUF={};
function mkBuf(key,dur,fill){if(BUF[key])return BUF[key];const c=AU.ctx,sr=c.sampleRate,n=Math.floor(sr*dur),b=c.createBuffer(1,n,sr),d=b.getChannelData(0);fill(d,sr,n);
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(d[i]));const nm=pk>0?.9/pk:1;const fade=Math.floor(sr*.06);
  for(let i=0;i<n;i++){d[i]*=nm;if(i>n-fade)d[i]*=(n-i)/fade}return BUF[key]=b}
// plucked string (Karplus-Strong): koto = silk/nylon string plucked with a tsume; shamisen = bright string + sawari buzz + skin slap
function stringBuf(f,kind){
  const k=kind+'|'+Math.round(f*4);
  return mkBuf(k,kind==='koto'?2.6:1.1,(d,sr,n)=>{
    const N=Math.max(2,Math.round(sr/f-.5)),buf=new Float32Array(N);
    let lp=0;const smooth=kind==='koto'?.55:.15;
    for(let i=0;i<N;i++){const r=Math.random()*2-1;lp=lp*smooth+r*(1-smooth);buf[i]=lp}
    const pp=Math.max(1,Math.floor(N*(kind==='koto'?.18:.1)));const tmp=buf.slice();for(let i=0;i<N;i++)buf[i]=tmp[i]-tmp[(i+pp)%N];
    const rho=kind==='koto'?.9985:.9935, S=kind==='koto'?.5:.38;
    let idx=0;
    for(let i=0;i<n;i++){const a=buf[idx],b=buf[(idx+1)%N];let y=a;

const VOX={}, VOXRAW={};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('bushiking-voice',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function voxLoad(){try{const db=await idb();for(const k of ['title','sortie']){const ab=await new Promise(r=>{try{const q=db.transaction('v').objectStore('v').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});if(ab)VOXRAW[k]=ab}}catch(e){} voxDecode()}
async function voxDecode(){if(!AU.ctx)return;for(const k in VOXRAW){if(VOX[k]||!VOXRAW[k])continue;try{VOX[k]=await AU.ctx.decodeAudioData(VOXRAW[k].slice(0))}catch(e){VOX[k]=null}}}
async function voxSave(k,ab){auInit();VOXRAW[k]=ab;VOX[k]=null;try{const db=await idb();db.transaction('v','readwrite').objectStore('v').put(ab,k)}catch(e){}await voxDecode();return !!VOX[k]}
async function voxDel(k){delete VOXRAW[k];delete VOX[k];try{const db=await idb();db.transaction('v','readwrite').objectStore('v').delete(k)}catch(e){}}
function voxPlay(k,delay=0){const s=S.settings;if(!AU.ctx||!VOX[k]||s.mute)return false;const c=AU.ctx,t=c.currentTime+.02+delay;
  const src=c.createBufferSource();src.buffer=VOX[k];src.playbackRate.value=s.deep?.86:1;
  const ls=filt('lowshelf',180);ls.gain.value=s.deep?7:2;const g=c.createGain();g.gain.value=1.5;src.connect(ls);ls.connect(g);route(g,AU.X,.4);src.start(t);return true}

const FX={cv:null,c:null,ps:[],run:false,last:0};
function fxInit(){FX.cv=document.createElement('canvas');FX.cv.id='fx';document.body.appendChild(FX.cv);fxSize();addEventListener('resize',fxSize)}
function fxSize(){const d=Math.min(2,devicePixelRatio||1);FX.cv.width=innerWidth*d;FX.cv.height=innerHeight*d;FX.c=FX.cv.getContext('2d');FX.c.setTransform(d,0,0,d,0,0)}
function fxAdd(p){if(RM&&p.type!=='ring')return;p.t=-(p.delay||0);FX.ps.push(p);if(!FX.run){FX.run=true;FX.last=performance.now();requestAnimationFrame(fxLoop)}}
function fxLoop(now){
  const dt=Math.min(.05,(now-FX.last)/1000);FX.last=now;const c=FX.c;c.clearRect(0,0,innerWidth,innerHeight);
  FX.ps=FX.ps.filter(p=>{p.t+=dt;if(p.t<0)return true;if(p.t>p.life){p.end&&p.end();return false}fxDraw(c,p,dt);return true});
  if(FX.ps.length)requestAnimationFrame(fxLoop);else FX.run=false;
}
function fxDraw(c,p,dt){
  const k=p.t/p.life; c.save();
  c.globalCompositeOperation=p.add?'lighter':'source-over';
  switch(p.type){
    case 'spark':p.vy+=(p.g||0)*dt;p.vx*=.97;p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=1-k;c.strokeStyle=p.color;c.lineWidth=p.size;c.lineCap='round';
      c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);c.stroke();break;
    case 'slash':{c.translate(p.x,p.y);c.rotate(p.ang);const L=p.len,r=Math.min(1,k/.35),x0=-L/2,x1=x0+L*r;
      c.globalAlpha=k<.35?1:1-(k-.35)/.65;c.shadowColor=p.color;c.shadowBlur=18;c.fillStyle='#fff';
      c.beginPath();c.moveTo(x0,0);c.quadraticCurveTo((x0+x1)/2,-p.size*(1-k*.6),x1,0);c.quadraticCurveTo((x0+x1)/2,p.size*.3,x0,0);c.fill();break}
    case 'streak':c.globalAlpha=1-k;c.strokeStyle=p.color;c.lineWidth=p.size*(1-k);c.lineCap='round';c.shadowColor=p.color;c.shadowBlur=14;
      c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x2,p.y2);c.stroke();break;
    case 'arrow':{const e=k*k*(3-2*k),x=p.x+(p.x2-p.x)*e,y=p.y+(p.y2-p.y)*e-Math.sin(k*Math.PI)*40,a=Math.atan2(p.y2-p.y,p.x2-p.x)-Math.cos(k*Math.PI)*.5;
      c.translate(x,y);c.rotate(a);c.strokeStyle='#f3e6c8';c.lineWidth=3;c.beginPath();c.moveTo(-26,0);c.lineTo(10,0);c.stroke();
      c.fillStyle='#e8eef7';c.beginPath();c.moveTo(16,0);c.lineTo(6,-5);c.lineTo(6,5);c.fill();c.fillStyle='#ffb4c7';c.fillRect(-28,-4,7,8);break}
    case 'shuri':{const e=k*k*(3-2*k),x=p.x+(p.x2-p.x)*e,y=p.y+(p.y2-p.y)*e-Math.sin(k*Math.PI)*24;c.translate(x,y);c.rotate(p.t*28);c.fillStyle='#e8eef8';c.strokeStyle='#4a5470';c.lineWidth=1.5;
      c.beginPath();for(let q=0;q<8;q++){const r=q%2?4:13,an=q*Math.PI/4;c.lineTo(Math.cos(an)*r,Math.sin(an)*r)}c.closePath();c.fill();c.stroke();c.fillStyle='#3a3f56';c.beginPath();c.arc(0,0,3,0,7);c.fill();break}
    case 'ring':{const r=p.r0+(p.r1-p.r0)*(1-Math.pow(1-k,3));c.globalAlpha=1-k;c.strokeStyle=p.color;c.lineWidth=p.size*(1-k*.5);c.shadowColor=p.color;c.shadowBlur=16;c.beginPath();
      if(p.sides){for(let i=0;i<=p.sides;i++){const a=i/p.sides*Math.PI*2-Math.PI/2;i?c.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r):c.moveTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r)}}else c.arc(p.x,p.y,r,0,Math.PI*2);c.stroke();break}
    case 'smoke':c.globalAlpha=(p.a||.5)*(1-k);c.fillStyle=p.color;c.beginPath();c.arc(p.x+p.vx*k,p.y+p.vy*k,p.size*(.5+k),0,Math.PI*2);c.fill();break;
    case 'dot':p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=1-k;c.fillStyle=p.color;c.shadowColor=p.color;c.shadowBlur=10;c.beginPath();c.arc(p.x,p.y,p.size*(1-k*.5),0,Math.PI*2);c.fill();break;
    case 'plus':p.y+=p.vy*dt;c.globalAlpha=1-k;c.strokeStyle=p.color;c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(p.x-p.size,p.y);c.lineTo(p.x+p.size,p.y);c.moveTo(p.x,p.y-p.size);c.lineTo(p.x,p.y+p.size);c.stroke();break;
    case 'bubble':p.y+=p.vy*dt;c.globalAlpha=1-k;c.strokeStyle=p.color;c.lineWidth=2;c.beginPath();c.arc(p.x+Math.sin(p.t*8+p.ph)*6,p.y,p.size,0,Math.PI*2);c.stroke();break;
    case 'petal':p.x+=p.vx*dt+Math.sin(p.t*3+p.ph)*.8;p.y+=p.vy*dt;p.rot+=dt*3;c.globalAlpha=k>.8?(1-k)*5:1;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;
      c.beginPath();c.ellipse(0,0,p.size,p.size*.55,0,0,Math.PI*2);c.fill();break;
    case 'flame':{p.x+=p.vx*dt+Math.sin(p.t*9+p.ph)*.6;p.y+=p.vy*dt;const col=k<.25?'255,240,170':k<.55?'255,150,50':'230,60,40';
      c.globalAlpha=(1-k)*.85;const r=p.size*(1-k*.7);const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(${col},1)`);g.addColorStop(1,`rgba(${col},0)`);
      c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,Math.PI*2);c.fill();break}
    case 'shard':p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;c.globalAlpha=1-k;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;
      c.beginPath();c.moveTo(0,-p.size);c.lineTo(p.size*.7,p.size*.6);c.lineTo(-p.size*.6,p.size*.4);c.fill();break;
  }
  c.restore();
}

function wKatana(x,y,ang,len=46){return `<g transform="translate(${x} ${y}) rotate(${ang})"><rect x="-2.6" y="-${len}" width="5.2" height="${len-6}" rx="2.6" fill="#eef3fb" stroke="#8a97b0" stroke-width="1"/><rect x="-7" y="-7" width="14" height="3.5" rx="1.7" fill="#f2c45c"/><rect x="-2.6" y="-4" width="5.2" height="13" rx="2" fill="#4a2f5e"/></g>`}
function wShuri(x,y,r=8,rot=0){return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0,-${r} L${r*.22},-${r*.22} L${r},0 L${r*.22},${r*.22} L0,${r} L-${r*.22},${r*.22} L-${r},0 L-${r*.22},-${r*.22} Z" fill="#e3eaf5" stroke="#4a5470" stroke-width="1.2"/><circle r="${r*.22}" fill="#3a3f56"/></g>`}
function wGunbai(x,y,ang,sz=1){return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${sz})"><rect x="-2" y="-6" width="4" height="20" rx="1.5" fill="#6b4426"/><path d="M0,-34 Q15,-33 15,-20 Q15,-8 0,-6 Q-15,-8 -15,-20 Q-15,-33 0,-34 Z" fill="#c8372a" stroke="#2a1418" stroke-width="1.4"/><circle cy="-21" r="6" fill="#f2c45c"/></g>`}
function wScroll(x,y,ang){return `<g transform="translate(${x} ${y}) rotate(${ang})"><rect x="-4" y="-16" width="8" height="26" rx="3" fill="#f4ecd8" stroke="#8a6a3a" stroke-width="1"/><rect x="-5.5" y="-18" width="11" height="4" rx="2" fill="#7a4a2a"/><rect x="-5.5" y="8" width="11" height="4" rx="2" fill="#7a4a2a"/><rect x="-4" y="-6" width="8" height="3" fill="#c8372a"/></g>`}
function wGun(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI,l=Math.hypot(x2-x1,y2-y1);return `<g transform="translate(${x1} ${y1}) rotate(${a})"><rect x="0" y="-3" width="${l*.38}" height="7" rx="2" fill="#7a4a2a"/><rect x="${l*.3}" y="-2" width="${l*.7}" height="4" rx="2" fill="#4a4a58"/><rect x="${l*.36}" y="-4" width="5" height="3" fill="#f2c45c"/></g>`}
const POSES={
  stand:{L:[34,102],R:[88,100],legs:0,lean:0},

function chibiFull(b,o={}){
  const L=b.look||{},T=TYPES[b.type],armor=L.armor||T.color,pose=POSES[o.pose||'stand']||POSES.stand,hand=o.hand||T.hand||'scroll';
  const sk='#ffe3cb',dark='#2a2232',hak=o.sil?'#000':'#2b2a44';
  const head=chibi(b,{fire:o.fire}).replace('<svg viewBox="0 -10 100 112"','<svg x="22" y="0" width="76" height="67" style="width:76px;height:67px;margin:0" viewBox="0 -12 100 88"');
  const sh={L:[43,76],R:[77,76]};
  const arm=(s)=>{const [x,y]=pose[s],[sx,sy]=sh[s];return `<path d="M${sx},${sy} L${x},${y}" stroke="${armor}" stroke-width="11" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="5.5" fill="${sk}"/>`};
  const legs=pose.legs?`<path d="M46,114 L32,140 L46,142 L56,116 Z" fill="${hak}"/><path d="M64,114 L80,140 L92,136 L76,112 Z" fill="${hak}"/><ellipse cx="38" cy="142" rx="9" ry="4" fill="${dark}"/><ellipse cx="88" cy="138" rx="9" ry="4" fill="${dark}"/>`
    :`<path d="M44,114 L40,140 L54,141 L57,114 Z" fill="${hak}"/><path d="M63,114 L66,141 L80,140 L76,114 Z" fill="${hak}"/><ellipse cx="46" cy="142" rx="9" ry="4" fill="${dark}"/><ellipse cx="74" cy="142" rx="9" ry="4" fill="${dark}"/>`;
  const torso=`<path d="M40,74 Q60,64 80,74 L78,104 Q60,109 42,104 Z" fill="${armor}"/><path d="M47,76 L60,90 L73,76" stroke="#f2c45c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="41" y="99" width="38" height="5" rx="2.5" fill="#f2c45c"/><path d="M39,103 L81,103 L85,119 L35,119 Z" fill="${armor}"/><path d="M39,103 L81,103 L85,119 L35,119 Z" fill="rgba(0,0,0,.22)"/>
    <path d="M48,104 L46,119 M60,104 L60,119 M72,104 L74,119" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
    <rect x="32" y="70" width="17" height="15" rx="4" fill="${armor}" transform="rotate(18 40 77)"/><rect x="71" y="70" width="17" height="15" rx="4" fill="${armor}" transform="rotate(-18 80 77)"/>
    <path d="M33,80 L48,85 M72,85 L87,80" stroke="#f2c45c" stroke-width="2"/>`;
  let wpn='';const [rx,ry]=pose.R;

  else if(hand==='scroll'){wpn=P==='cast'?'':wScroll(rx,ry-6,-15)}
  const front=P==='guard'||P==='pray'||P==='gun';
  const body=`<g transform="rotate(${pose.lean} 60 128)">${legs}${torso}${front?'':arm('L')}${front?'':wpn}${front?'':arm('R')}${head}${front?arm('L')+arm('R')+wpn:''}</g>`;
  return `<svg viewBox="-12 -8 144 160" aria-hidden="true" class="cfull${o.sil?' sil':''}"><ellipse cx="60" cy="144" rx="34" ry="6" fill="rgba(0,0,0,.28)"/>${o.under||''}${body}${o.over||''}</svg>`;
}

function wazaArt(w){
  const x=w.fx,dm=x.dmg||0,attack=dm>=1||x.hits>1||x.fixed||x.pct||x.special;
  const styles=[['slash','katana','naomasa'],['throw','yumi','magoichi'],['fan','yari','saizo']];
  const st=styles[hash(w.id)%3];
  let pose=st[0],hand=st[1],who=BI[st[2]],under=[],over=[];
  const atkFx=()=>{if(pose==='slash')(x.hits>1?over:over).push(fxArt(x.hits>1?'multi':'slash'));if(pose==='throw')over.push(fxArt('shuri'));if(pose==='fan')over.push(fxArt('wind'))};
  if(w.sig){who=BI[w.sig];const fav=TYPES[who.type].hand;pose=fav==='katana'?'slash':fav==='yumi'?'throw':fav==='yari'?'fan':'cast';hand=fav||'scroll';under.push(fxArt('rainbow'));if(pose==='cast')over.push(fxArt('aura'));else atkFx();
    if(x.poison)over.push(fxArt('poison'));if(x.seal)over.push(fxArt('ofuda'));if(x.invuln||x.guard)over.push(fxArt('gold'));if(x.heal)over.push(fxArt('heal'))}
  else if(x.fixed&&/銃|火縄/.test(w.name)){pose='gun';who=BI.magoichi;over.push(fxArt('gunsmoke'))}
  else if(!attack&&(x.heal||x.regen||x.cleanse)){pose='pray';who=BI.kojuro;hand='scroll';under.push(fxArt('heal'))}
  else if(!attack&&(x.def||x.guard||x.invuln||x.counter||x.endure)){pose='guard';who=BI.saizo;hand='katana';over.push(fxArt(x.invuln?'gold':'shield'))}
  else if(!attack&&x.evade){pose='stand';who=BI.magoichi;hand='yumi';under.push(fxArt('evade'))}
  else if(x.seal&&dm<1.4){pose='point';who=BI.kojuro;hand='scroll';over.push(fxArt('ofuda'))}
  else if(x.scout&&dm<1.4){pose='point';who=BI.kojuro;hand='scroll';over.push(fxArt('eye'))}
  else if(!attack&&(x.atkUp||x.steal)){pose='cast';who=BI.naomasa;hand='katana';under.push(fxArt('aura'))}
  else if(dm<1&&(x.foeAtkDown||x.vuln||x.poison)){pose='point';who=BI.kojuro;hand='scroll';over.push(fxArt(x.burn?'fire':x.poison?'poison':'smoke'))}
  else{atkFx();if(x.burn)over.push(fxArt('fire'));else if(x.poison)over.push(fxArt('poison'));if(x.stun)over.push(fxArt('thunder'));if(x.atkUp)under.push(fxArt('aura'));if(x.def||x.guard)under.push(fxArt('shield'));if(x.heal||x.drain)under.push(fxArt('heal'))}
  const sil=!!(w.sig&&!S.bushi[w.sig]);wazaArt.last={who,pose,hand,sil};
  return chibiFull(who,{pose,hand,fire:true,sil,under:under.join(''),over:over.join('')});
}

function drawCard({minRar='N'}={}){
  const min=RAR.indexOf(minRar);
  let roll=Math.random()*100, r= roll<4?'UR':roll<18?'SR':roll<48?'R':'N';
  if(RAR.indexOf(r)<min)r=minRar;

function arrowPath(a,b,cx,cy,r,bend){
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const p1={x:a.x+ux*r,y:a.y+uy*r},p2={x:b.x-ux*(r+4),y:b.y-uy*(r+4)};
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,ox=mx-cx,oy=my-cy,ol=Math.hypot(ox,oy)||1;
  const c={x:mx+ox/ol*bend,y:my+oy/ol*bend};
  return {d:`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,lx:mx+ox/ol*(bend*.55+20),ly:my+oy/ol*(bend*.55+20)};
}

function howTo(){

    <li>手に技カードをセットしておくと、その手で勝ったときに技が発動します。セットしていない手は通常攻撃です。</li>
    <li>武士は4タイプ。<b>剛</b>は兜、<b>迅</b>は手裏剣、<b>鉄</b>は軍配が得意。<b>剛▶迅▶鉄▶剛</b>の三すくみで、有利なタイプへの攻撃は1.25倍。<b>智</b>はどのタイプとも互角で、技の威力が1.3倍。</li>
    <li>タイプごとに特性があります。剛「豪腕」通常攻撃+15%／迅「神速」12%でかわす／鉄「金城」受けるダメージ-15%／智「軍略」技1.3倍。</li>
    <li>戦場は毎回変わります（月夜の境内・桜の城下町・霧の川中島・夕焼けの関ヶ原・雪の山城…）。</li>
    <li><b>交換所</b>（キンピカ座）：だぶりカードを「N20枚・R10枚・SR5枚・UR3枚」のどれかで支払うと、交換限定の武士（5体）や技（10種）と1回ずつ交換できます。限定カードは普段は出ません。</li>
    <li>合戦中は<b>ほとけ様</b>が敵の出しそうな手を教えてくれます（だいたい6割で当たる）。1戦に1回、ほとけ様をタップして祈ると、必ず当たるお告げになります。</li>
    <li>技カードの「▶試す」で、わら人形相手に技の演出を見られます。武士は選択中の武士をもう一度タップするとカードが見られます。</li>
    <li>タイトルの「キンピカ座」では案内役のキンピカ丸が、ヒント・おみくじ（1日1回）・だぶりカードの両替をしてくれます。</li>
    <li>敵の「気配」はたまに外れます。敵の技セットも見えるので読み合いを楽しんでください。</li>
    <li>3連戦の勝ち抜き。全勝するとたまに伝説の武将が待つEXステージが出現！撃破でSR以上のカードがもらえます。</li>
    <li>出陣の前に毎回カードを1枚もらえます（武士か技のどちらか）。専用技は対応する武将だけが使えます。</li>
    <li><b>カウント</b>：手を選ぶ制限時間は10秒。あいこになると5秒になり、勝敗が決まるまで5秒のまま。0になると手が自動で出ます。</li>
    <li><b>リタイア</b>：戦の途中でやめられますが、その出陣で手に入れたカードは没収されます。</li>
   </ul>
   <div style="text-align:center;margin-top:10px"><button class="btn gold" id="cl">わかった</button></div>
  </div></div>`;
  $('#cl').onclick=closeModal;
}

function makeEnemy(i,forced){

  const maxR=RAR.indexOf(sg.tier);

function chipsOf(f){
  const s=f.st,c=[];
  if(s.atkUp.t>0)c.push(`<span class="chip up">攻↑${Math.round(s.atkUp.v*100)}% ${s.atkUp.t-1}</span>`);
  if(s.def.t>0)c.push(`<span class="chip up">守↑${Math.round(s.def.v*100)}% ${s.def.t-1}</span>`);
  if(s.guard>0)c.push(`<span class="chip up">堅陣×${s.guard}</span>`);
  if(s.evade>0)c.push(`<span class="chip up">回避</span>`);
  if(s.counter>0)c.push(`<span class="chip up">返し</span>`);
  if(s.invuln>0)c.push(`<span class="chip up">無敵 ${s.invuln-1}</span>`);
  if(s.regen.t>0)c.push(`<span class="chip up">再生 ${s.regen.t-1}</span>`);
  if(s.atkDown.t>0)c.push(`<span class="chip down">攻↓${Math.round(s.atkDown.v*100)}% ${s.atkDown.t-1}</span>`);
  if(s.poison.t>0)c.push(`<span class="chip down">毒 ${s.poison.t-1}</span>`);
  if(s.seal>0)c.push(`<span class="chip seal">技封印 ${s.seal-1}</span>`);
  if(s.vuln.t>0)c.push(`<span class="chip down">守↓${Math.round(s.vuln.v*100)}% ${s.vuln.t-1}</span>`);
  if(s.stun>0)c.push(`<span class="chip seal">ひるみ×${s.stun}</span>`);
  return c.join('');
}
function updateAll(){

function nextCpu(){

  let r=Math.random()*wts.reduce((a,b)=>a+b),k=0;while(r>wts[k]){r-=wts[k];k++}

async function choose(h){

  const P=R.p,E=R.e,eh=R.cpu;

  vd.textContent='';vd.className='verdict';{const c=$('#cnt');c.className='count idle';c.textContent='勝負'}$('#cntl').textContent='';$('#omen').classList.add('gone');
  v3Shot('reveal');

  await sleep(550); if(R!==me||R.dead)return;
  if(h===eh){
    R.tie=true;
    vd.textContent='あいこ';vd.className='verdict tie show';fxClash();SE.tie();npcSay('あいこじゃ〜！');v3Npc('both');
    log('あいこ！ 鍔迫り合いで互いに小ダメージ');

  }else{

    const pw=BEATS[h]===eh;
    vd.textContent=pw?'勝ち！':'負け…';vd.className='verdict show '+(pw?'win':'lose');
    npcSay(`${(pw?P:E).b.name}の勝ち〜！`);v3Npc(pw?'p':'e');
    (pw?rp:re).classList.add('win');(pw?re:rp).classList.add('lose');
    pw?SE.win():SE.lose();

    await strike(pw?P:E,pw?E:P,pw?h:eh);

async function checkEnd(){
  const P=R.p,E=R.e;
  if(P.hp>0&&E.hp>0)return false;
  stopCount(); R.dead=true;
  const loser=P.hp<=0?P:E,winner=loser===P?E:P;

// ---- animation ----

function koukanPay(tab,item){

function win(){
  S.stats.wins++;save();
  const i=R.stage,E=R.e.b;
  if(i<2){
    const P=BI[S.deck.bushi], nb=pick(BUSHI.filter(x=>x.rar===STAGES[i+1].tier&&!x.lim&&x.id!==S.deck.bushi));
    screen(`<div class="scene fire"><div class="shout">次の戦も燃えてきたぜ！</div><div class="hero-fire" id="hero">${face(P,{fire:true})}</div></div>
      <div class="big" style="color:var(--gold)">勝利！</div>
      <div>${E.name}を討ち取った！ ${P.name}の闘志が燃え上がる。<br>HPは全回復して次の戦へ。</div>
      <div class="row" style="justify-content:center"><button class="btn shu" id="nx">次の戦へ</button><button class="btn ghost" id="rt">リタイア</button></div>`);
    jingle('win'); fxFlash('#ffcf80'); emitOn('#hero','fire');
    $('#nx').onclick=()=>appear(i+1,nb);$('#rt').onclick=()=>confirmRetire(doRetire);
  }else if(i===2){
    S.stats.clears++;save();
    if(Math.random()<.35){
      const boss=pick(BUSHI.filter(x=>x.rar==='UR'&&!x.lim&&x.id!==S.deck.bushi));
      screen(`<div class="label" style="color:var(--sakura)">三連勝の果てに…</div>
        <div class="big" style="background:linear-gradient(90deg,#ff8fb0,#ffd36b,#7ee0b5,#7fb6ff,#c79bff);-webkit-background-clip:text;background-clip:text;color:transparent">EXステージ出現！</div>
        <div style="width:150px">${face(boss)}</div>
        <div>伝説の武将 <b>${boss.name}</b> が立ちはだかる！<br>撃破すればSR以上のカードを授かる。</div>
        <button class="btn shu" id="nx">挑む！</button>`);
      jingle('exappear');fxFlash('#ffe8b0');fxPetals(50);
      $('#nx').onclick=()=>beginStage(3,boss);
    }else clear(false);
  }else{
    S.stats.ex++;save();stopTrack();
    const res=drawCard({minRar:'SR'});
    showDraw('EX撃破の褒美',res,()=>clear(true));
  }
}
function clear(ex){
  const b=BI[S.deck.bushi]; RUN=null; S.bless=null; save(); jingle('clear'); fxPetals(80);
  screen(`<div class="scene fire"><div class="shout">${ex?'天下に敵なし！':'天下は我が手に！'}</div><div class="hero-fire" id="hero">${face(b,{fire:true})}</div></div>
    <div class="big" style="color:var(--gold)">${ex?'天下無双！':'天下統一！'}</div>
    <div>${b.name}「${b.line}」</div>
    <div class="label">これまでの天下統一 ${S.stats.clears}回 ・ EX撃破 ${S.stats.ex}回</div>
    <div class="row" style="justify-content:center"><button class="btn shu" id="again">もう一度出陣</button><button class="btn" id="tt">タイトルへ</button></div>`);
  emitOn('#hero','fire');
  $('#again').onclick=startRun;$('#tt').onclick=title;
}
function lose(){
  const b=BI[S.deck.bushi],E=R.e.b; RUN=null; S.bless=null; save(); jingle('lose');
  screen(`<div class="scene dusk">
      <div class="gogo">ゴゴゴゴ…</div>
      <div class="chaser" id="chaser">${face(E,{fire:true})}</div>
      <div class="bubble flee-bubble">ひぃぃ〜っ！</div>
      <div class="dust"></div><div class="dust" style="animation-delay:.3s"></div>
      <div class="flee"><div class="face" style="--tc:${TYPES[b.type].color};background:none;box-shadow:none;overflow:visible">${chibi(b,{back:true})}</div></div>
    </div>
    <div class="big" style="color:#8c95c4">敗北…</div>
    <div>${STAGES[R.stage].name}で${E.name}に敗れ、${b.name}は命からがら逃げ出した。<br>手に入れたカードはそのまま残ります。</div>
    <div class="vow">次こそは勝ち抜いてやる！</div>
    <div class="row" style="justify-content:center"><button class="btn shu" id="again">再び出陣</button><button class="btn" id="fm">編成を見直す</button><button class="btn ghost" id="tt">タイトルへ</button></div>`);
  SE.flee(); emitOn('#chaser','dark');
  setTimeout(()=>{if(document.querySelector('.scene.dusk'))playTrack('defeat')},RM?500:3800);
  $('#again').onclick=startRun;$('#fm').onclick=()=>formation(false);$('#tt').onclick=title;
}
function appear(i,nb){
  const sg=STAGES[i]; const loc=pickLoc(i); if(RUN)RUN.nextLoc=loc;
  const pt=S.deck.bushi&&BI[S.deck.bushi].type, tm=typeMul(pt,nb.type);
  screen(`<div class="label" style="color:var(--sakura)">${sg.name}</div>
    <div class="scene dark"><div class="enemy-in" id="foe">${face(nb)}</div></div>
    <div class="appear-title">敵将 現る！</div>
    <div class="appear-info stack" style="align-items:center">
      <div class="bubble">「${nb.line}」</div>
      <div class="row" style="justify-content:center;gap:6px">${rb(nb.rar)}${tb(nb.type)}<b style="font-size:22px">${nb.name}</b></div>
      <div style="font-size:13px;color:var(--mute)">${TYPES[nb.type].desc}・特性「${TYPES[nb.type].trait}」</div>
      <div style="font-size:13px;font-weight:900;color:${tm>1?'#8ff0b2':tm<1?'#ffb4c7':'var(--mute)'}">${tm>1?'▲ タイプ相性はあなたが有利！':tm<1?'▼ タイプ相性はあなたが不利…':'タイプ相性は互角'}</div>
      <div class="label">決戦の地：${LOCS[loc].name}</div>
      <div class="row" style="justify-content:center"><button class="btn shu" id="go2">迎え撃つ！</button><button class="btn ghost" id="rt">リタイア</button></div>
    </div>`);
  stopTrack(); SE.roar(); emitOn('#foe','dark');
  setTimeout(()=>{if(document.querySelector('#foe')){playTrack('appear');fxFlash('#ff9ab0')}},RM?300:1800);
  $('#go2').onclick=()=>beginStage(i,nb);$('#rt').onclick=()=>confirmRetire(doRetire);
}

let RUN=null;
(function boot(){
  const b=document.createElement('button');b.id='snd';b.className='';b.onclick=soundPanel;document.body.appendChild(b);updSnd();
  const h=document.createElement('div');h.className='snd-hint';h.textContent='タップで音が鳴ります';document.body.appendChild(h);
  fxInit();
  title();
})();
</script>

<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
